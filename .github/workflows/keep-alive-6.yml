name: Keep Render Server Alive 6

on:
  schedule:
    # Run every 5 minutes, staggered by 0 minutes (UTC timezone)
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -m 60 https://ilm-ai-backend-256x.onrender.com/health || true
