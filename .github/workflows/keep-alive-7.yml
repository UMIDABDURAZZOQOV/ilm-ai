name: Keep Render Server Alive 7

on:
  schedule:
    # Run every 5 minutes, staggered by 1 minute (UTC timezone)
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -m 60 https://ilm-ai-backend-256x.onrender.com/health || true
