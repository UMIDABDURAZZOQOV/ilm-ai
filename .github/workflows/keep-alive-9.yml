name: Keep Render Server Alive 9

on:
  schedule:
    # Run every 5 minutes, staggered by 3 minutes (UTC timezone)
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -m 60 https://ilm-ai-backend-256x.onrender.com/health || true
