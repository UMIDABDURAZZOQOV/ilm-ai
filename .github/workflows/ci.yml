name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: dummy
      TELEGRAM_BOT_TOKEN: dummy
      DATABASE_URL: sqlite:////tmp/ilm-ci.db
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Import check
        run: python -m compileall -q routers services
      - name: Run tests
        run: python -m pytest -q
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
            context: .
            push: false
            tags: ilm-ai:ci
        continue-on-error: true

  deploy:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploying...
        run: echo "Deploying to production server (e.g., VPS or Railway)"
        # Here we would typically use an action like 'appleboy/ssh-action' or 'railway deploy'
