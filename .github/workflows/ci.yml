name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      PYTHON_DOTENV_DISABLED: '1'
      GEMINI_API_KEY: dummy
      TELEGRAM_BOT_TOKEN: dummy
      DATABASE_URL: sqlite:////tmp/chemistry_staging_world_history_staging_uzbekistan_history_staging_ci.db
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Import check
        run: python -m compileall -q routers services
      - name: Run tests
        run: python -m pytest -q
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
            context: .
            push: false
            tags: ilm-ai:ci

  # Production deployment is a separately approved Render operator action.
  # The former echo-only deploy job performed no deployment and misleadingly
  # appeared successful. This workflow tests/builds only; see the manual
  # mobile-contract-preflight workflow for read-only post-deployment evidence.
