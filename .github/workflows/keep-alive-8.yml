name: Keep Render Server Alive 8

on:
  schedule:
    # Run every 5 minutes, staggered by 2 minutes (UTC timezone)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -m 60 https://ilm-ai-backend-256x.onrender.com/health || true
