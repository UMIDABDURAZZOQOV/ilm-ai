name: Keep Render Server Alive 5

on:
  schedule:
    # Run every 5 minutes, staggered by 4 minutes (UTC timezone)
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -m 60 https://ilm-ai-backend-256x.onrender.com/health || true
